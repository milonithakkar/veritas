# Customer Support Chatbot Policy
# High risk tolerance — customer-facing, brand liability at stake
# Strict on PII and factual accuracy

use_case: customer_support
display_name: "Customer Support Chatbot"
model_name: gemini-2.5-flash
geography: EU
max_latency_ms: 200

fast_track:
  pii_detection: true
  pii_action: BLOCK              # Never let PII reach a customer
  confidence_threshold: 0.65
  low_confidence_action: FLAG
  max_tokens_per_response: 800
  token_exceed_action: FLAG
  blocklist_enabled: true
  blocklist_action: BLOCK

deep_track:
  grounding_enabled: true
  grounding_similarity_threshold: 0.72  # Fairly strict — must be grounded in policy docs
  grounding_action: FLAG
  bias_detection_enabled: true
  bias_action: FLAG

audit:
  full_audit: true
  require_human_review: false   # Flag but don't block delivery for non-critical flags
